name: Theo dõi tin PlayStation

on:
  workflow_dispatch:
  # Bật 29/09/2026 23:45 sau lượt chạy đầu xanh (run 36599322758). GitHub có thể trễ lịch vài phút lúc đông.
  schedule:
    - cron: "3-59/10 * * * *"   # phút 3,13,23… — tránh đầu giờ (GitHub hay trễ/bỏ lượt lịch lúc :00)

permissions:
  contents: write

# 14/10 (Sol): khoá concurrency chuyển xuống từng job — job social chạy lâu không được giữ chân lượt sau của job cũ.
jobs:
  theo-doi:
    runs-on: ubuntu-latest
    concurrency:
      group: theo-doi-tin
      cancel-in-progress: false
    timeout-minutes: 8
    steps:
      - name: Lấy mã theo dõi từ main
        uses: actions/checkout@v4
        with:
          ref: main
          path: ma
          sparse-checkout: .github/theo-doi
          sparse-checkout-cone-mode: false

      - name: Lấy nhánh theo-doi (tạo nếu chưa có)
        run: |
          set -e
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Chỉ lấy nhánh theo-doi (2 file JSON) — KHÔNG tải cả kho web (4.000+ trang game, hàng chục MB)
          if git ls-remote --exit-code --heads "$URL" theo-doi >/dev/null 2>&1; then
            git clone --depth 20 --single-branch --branch theo-doi "$URL" trang-thai
          else
            git init -q -b theo-doi trang-thai
            cd trang-thai
            git remote add origin "$URL"
            echo '{}' > tin-da-thay.json
            echo '[]' > tin-moi.json
          fi

      - name: Chạy theo dõi
        env:
          NTFY_TIN: ${{ secrets.NTFY_TIN }}
          GITHUB_TOKEN: ${{ github.token }}  # Hào 03/10: tạo release viet-* gọi routine viết tin
        run: python3 ma/.github/theo-doi/theo_doi_tin.py --dir trang-thai

      - name: Ghi trạng thái nếu có đổi
        run: |
          cd trang-thai
          git config user.name "theo-doi-bot"
          git config user.email "theo-doi-bot@users.noreply.github.com"
          git add tin-da-thay.json tin-moi.json
          if git diff --cached --quiet; then
            echo "Không đổi gì."
          else
            git commit -m "theo-doi: cập nhật trạng thái"
            # Đẩy lỗi thì báo trùng ở lượt sau: thử rebase + đẩy lại tối đa 3 lần (báo trùng hiếm tốt hơn mất tin)
            ok=0
            for i in 1 2 3; do
              if git push origin theo-doi; then ok=1; break; fi
              echo "Đẩy lỗi lần $i — pull --rebase rồi thử lại"
              git pull --rebase origin theo-doi || git rebase --abort || true
              sleep 3
            done
            [ "$ok" = 1 ] || { echo "Không đẩy được trạng thái sau 3 lần"; exit 1; }
          fi

  # 14/10/2026: job RIÊNG cho máy bắt tin social — không `needs`, nhánh trạng thái riêng `theo-doi-social`.
  # Social treo/chết không được làm mất trạng thái tin cũ (job `theo-doi` ở trên không đổi một dòng).
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: theo-doi-social
      cancel-in-progress: false
    steps:
      - name: Lấy mã theo dõi từ main
        uses: actions/checkout@v4
        with:
          ref: main
          path: ma
          sparse-checkout: .github/theo-doi
          sparse-checkout-cone-mode: false

      - name: Lấy nhánh theo-doi-social (tạo nếu chưa có)
        run: |
          set -e
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" theo-doi-social >/dev/null 2>&1; then
            git clone --depth 20 --single-branch --branch theo-doi-social "$URL" trang-thai-social
          else
            git init -q -b theo-doi-social trang-thai-social
            cd trang-thai-social
            git remote add origin "$URL"
          fi

      - name: Theo dõi social
        timeout-minutes: 5
        env:
          NTFY_TIN: ${{ secrets.NTFY_TIN }}
          SG_TIN_URL: https://qkpbokksubmqvinetdtv.supabase.co/functions/v1/sg-tin
          SG_TIN_KHOA: ${{ secrets.SG_TIN_KHOA }}
        run: python3 ma/.github/theo-doi/theo_doi_social.py --dir trang-thai-social

      - name: Ghi trạng thái social nếu có đổi
        if: always()
        run: |
          cd trang-thai-social
          [ -f social-da-thay.json ] || { echo "Chưa có trạng thái."; exit 0; }
          git config user.name "theo-doi-bot"
          git config user.email "theo-doi-bot@users.noreply.github.com"
          git add social-da-thay.json
          if git diff --cached --quiet; then
            echo "Không đổi gì."
          else
            git commit -m "theo-doi-social: cập nhật trạng thái"
            ok=0
            for i in 1 2 3; do
              if git push origin theo-doi-social; then ok=1; break; fi
              echo "Đẩy lỗi lần $i — pull --rebase rồi thử lại"
              git pull --rebase origin theo-doi-social || git rebase --abort || true
              sleep 3
            done
            [ "$ok" = 1 ] || { echo "Không đẩy được trạng thái sau 3 lần"; exit 1; }
          fi
